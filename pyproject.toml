[project]
name = "book-grounded-langgraph-agent"
version = "0.1.0"
description = "Book-grounded LangGraph agent framework"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "langgraph>=0.2.30",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
