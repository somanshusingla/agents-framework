[project]
name = "agent-framework"
version = "0.1.0"
description = "Reusable config-driven LangGraph agent framework"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "langgraph>=0.2.30",
  "httpx>=0.27",
  "langsmith>=0.1",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
